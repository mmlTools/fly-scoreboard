name: Push
on:
  push:
    branches: [master, main, 'release/**']
    tags: ['*']
permissions:
  contents: read
jobs:
  check-format:
    if: github.ref_type == 'branch'
    uses: ./.github/workflows/check-format.yaml

  create-release:
    name: Release existing build packages
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find successful manual build for tagged commit
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const spec = require('./buildspec.json');
            const release = require('./.github/scripts/release-from-build.cjs');
            const tag = context.ref.replace('refs/tags/', '');
            release.validateTag(tag, spec.version);
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const run = await release.findBuild(github, context.repo, sha, spec);
            core.setOutput('run-id', String(run.id));
            core.setOutput('artifact-pattern', spec.name + '-' + spec.version + '-*');
            core.setOutput('name', spec.displayName + ' ' + tag);
            core.setOutput('prerelease', spec.version.includes('-'));
            core.info('Reusing packages from ' + run.html_url);
      - name: Download packages without rebuilding
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run-id }}
          pattern: ${{ steps.build.outputs.artifact-pattern }}
          path: release-assets
          merge-multiple: true
      - name: Generate package checksums
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(*.exe *.zip *.pkg *.deb *.ddeb *.tar.xz)
          if (( ${#packages[@]} == 0 )); then
            echo '::error::No release packages were downloaded.'
            exit 1
          fi
          sha256sum "${packages[@]}" > CHECKSUMS.txt
      - name: Attach packages to release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.build.outputs.name }}
          prerelease: ${{ steps.build.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
